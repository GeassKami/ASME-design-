<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASME Fabrication: UW-12 & UW-16 | SAS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 30px; }
        h2 { width: 100%; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-top: 0; }
        .input-section, .output-section { flex: 1; min-width: 320px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        
        .section-title { margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px; color: #444; margin-top: 15px;}
        .note { font-size: 0.85em; color: #666; font-style: italic; margin-bottom: 15px; display: block; }
        
        .result-card { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-left: 5px solid #0056b3; }
        .val-large { font-size: 2em; font-weight: bold; color: #0056b3; margin: 10px 0; }
        .code-ref { font-size: 0.85em; color: #666; background: #e9ecef; padding: 3px 8px; border-radius: 4px; font-weight: bold; float: right;}
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;}
        .data-box { background: #e9ecef; padding: 10px; border-radius: 6px; text-align: center; }
        
        /* Schematic CSS */
        .diagram { margin-top: 25px; height: 180px; position: relative; background: #f1f5f9; border-radius: 6px; border: 1px solid #cbd5e1; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px;}
        .shell-plate { width: 80%; height: 40px; background: #94a3b8; border: 2px solid #334155; position: absolute; bottom: 20px; }
        .nozzle-pipe { width: 60px; height: 120px; background: #cbd5e1; border: 2px solid #334155; border-bottom: none; position: absolute; bottom: 60px; z-index: 5;}
        .fillet-left { width: 0; height: 0; border-bottom: 25px solid #ef4444; border-left: 25px solid transparent; position: absolute; bottom: 60px; left: calc(50% - 55px); z-index: 10;}
        .fillet-right { width: 0; height: 0; border-bottom: 25px solid #ef4444; border-right: 25px solid transparent; position: absolute; bottom: 60px; right: calc(50% - 55px); z-index: 10;}
        .annotation { position: absolute; font-size: 0.85em; font-weight: bold; color: #b91c1c; bottom: 85px; right: calc(50% - 100px);}
    </style>
</head>
<body>

<div class="container">
    <h2>ASME Fabrication: Joints & Weld Sizing</h2>
    
    <div class="input-section">
        <h4 class="section-title" style="margin-top:0;">Joint Efficiency (UW-12)</h4>
        <div class="form-group">
            <label>Type of Joint</label>
            <select id="valType" onchange="calculate()">
                <option value="1">Type 1: Double-Welded Butt Joint</option>
                <option value="2">Type 2: Single-Welded with Backing Strip</option>
            </select>
        </div>
        <div class="form-group">
            <label>Degree of Radiography (RT)</label>
            <select id="valRT" onchange="calculate()">
                <option value="full">Full (RT-1 / RT-2)</option>
                <option value="spot">Spot (RT-3)</option>
                <option value="none">None (RT-4)</option>
            </select>
        </div>

        <h4 class="section-title">Weld Sizing Inputs (UW-16)</h4>
        <span class="note">Enter the nominal uncorroded thicknesses.</span>
        <div class="form-group"><label>Shell/Head Thickness (t) [mm]</label><input type="number" id="valT" value="12" step="0.5" oninput="calculate()"></div>
        <div class="form-group"><label>Nozzle Neck Thickness (tn) [mm]</label><input type="number" id="valTn" value="8" step="0.5" oninput="calculate()"></div>
    </div>

    <div class="output-section">
        
        <div class="result-card" style="border-left-color: #28a745;">
            <div><strong>Joint Efficiency (E)</strong> <span class="code-ref">Table UW-12</span></div>
            <div class="val-large" id="outE" style="color: #28a745;">--</div>
            <div style="font-size: 0.9em; color: #555;" id="outEText">Multiplier applied to allowable stress.</div>
        </div>

        <div class="result-card">
            <div><strong>Minimum Fillet Weld Leg Size</strong> <span class="code-ref">UW-16.1</span></div>
            <div class="val-large" id="outLeg">-- mm</div>
            
            <div class="grid-2">
                <div class="data-box">
                    <div style="font-size: 0.8em; color: #666;">t_min</div>
                    <div style="font-weight:bold;" id="outTmin">-- mm</div>
                </div>
                <div class="data-box">
                    <div style="font-size: 0.8em; color: #666;">Throat (tc)</div>
                    <div style="font-weight:bold;" id="outTc">-- mm</div>
                </div>
            </div>
            
            <div class="diagram">
                <div class="nozzle-pipe"></div>
                <div class="fillet-left"></div>
                <div class="fillet-right"></div>
                <div class="shell-plate"></div>
                <div class="annotation">Leg = <span id="lblAnnot">--</span></div>
            </div>
        </div>

    </div>
</div>

<script>
    function calculate() {
        // --- UW-12 Logic ---
        const type = document.getElementById('valType').value;
        const rt = document.getElementById('valRT').value;
        let E = 1.0;

        if (type === "1") {
            if (rt === "full") E = 1.00;
            else if (rt === "spot") E = 0.85;
            else if (rt === "none") E = 0.70;
        } else if (type === "2") {
            if (rt === "full") E = 0.90;
            else if (rt === "spot") E = 0.80;
            else if (rt === "none") E = 0.65;
        }

        document.getElementById('outE').innerText = E.toFixed(2);
        
        // --- UW-16 Logic ---
        const t = parseFloat(document.getElementById('valT').value) || 0;
        const tn = parseFloat(document.getElementById('valTn').value) || 0;

        if (t <= 0 || tn <= 0) {
            document.getElementById('outLeg').innerText = "Invalid";
            return;
        }

        // t_min is lesser of 19 or the thinner part
        let t_min = Math.min(19, t, tn);
        
        // tc is lesser of 6mm or 0.7 * t_min
        let tc = Math.min(6, 0.7 * t_min);
        
        // Leg = tc / sin(45)
        let leg = tc / 0.707;

        document.getElementById('outTmin').innerText = t_min.toFixed(2) + " mm";
        document.getElementById('outTc').innerText = tc.toFixed(2) + " mm";
        document.getElementById('outLeg').innerText = leg.toFixed(2) + " mm";
        document.getElementById('lblAnnot').innerText = leg.toFixed(1) + " mm";
    }

    // Initialize
    calculate();
</script>
</body>
</html>
